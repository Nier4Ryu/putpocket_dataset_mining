  tokenizer_revision: pinned-revision-placeholder
  chat_template_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  frozen_history:
    messages: [sys, q1, a1]
    history_token_count: 16
    donor_token_ids_sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    edited_token_ids_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
  first_post_edit_request_token_ids_sha256: "cdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab"
  edit:
    message_path: sys
    old_utf8_span: [48, 60]
    new_utf8_span: [48, 60]
    mapping_kind: same_length_same_position
    positions: [5]
    old_token_ids: [101]
    new_token_ids: [202]
    alignment_sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    rope_treatment: positions_unchanged
  mandatory_recompute_positions: [5]
  mandatory_recompute_reason: edited token; no additional implementation closure in this example
  eligible_downstream_history_range: [6, 16]
  q2_token_range_in_first_post_edit_request: [16, 20]
  first_genuinely_later_token_position: 20

selector:
  ranked_quantity: importance_for_recompute
  score_direction: higher_score_first
  source_provenance:
