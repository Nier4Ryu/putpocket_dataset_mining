  q2_and_later_tokens_run_normally: true
  true_selective_prefill_claim: true
  compute_saving_claim: true
  layer_product_rank_slot_evidence_required: true

# For a full-target-prefill/donor-overwrite reference, change backend_kind to
# accuracy_emulation_compute_then_overwrite and set both claim fields false.
evaluation:
  official_evaluator_only: true
  fresh_repository_container_per_method_budget: true
  a1_q2_replay_attested: true
  one_complete_result_per_budget: true

evidence:
  required_artifacts:
    - frozen_episode_manifest
    - canonical_messages_and_token_arrays
    - edit_alignment_and_position_sets
    - a1_backend_message_and_tool_action
    - q2_tool_result_and_post_a1_repository_attestation
    - selector_scores_order_and_budget_sets
    - backend_layer_product_rank_slot_evidence
    - complete_agent_trajectory_and_generated_patch
