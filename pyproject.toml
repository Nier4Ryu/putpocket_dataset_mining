[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "putpocket-dataset-mining"
version = "0.5.0"
description = "Dataset-mining runner and Git-delivered cluster experiment package."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "datasets>=2.20",
  "pyyaml>=6.0",
  "transformers>=4.43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vllm = ["vllm"]

[project.scripts]
putpocket-dataset-mining = "putpocket_dataset_mining.cli:main"
putpocket-remote-verifier = "putpocket_dataset_mining.remote_verifier.cli:main"
putpocket-remote-workspace = "putpocket_dataset_mining.remote_workspace:main"
putpocket-agent = "putpocket_dataset_mining.agent_cli:main"
putpocket-cluster = "putpocket_dataset_mining.cluster_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
